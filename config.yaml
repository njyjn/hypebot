name: "HypeBot"
version: "0.10.0"
slug: "hypebot"
description: "Alerts when hard-to-find products are in stock for store pickup"
url: "https://github.com/njyjn/hypebot"
image: ghcr.io/njyjn/hypebot
startup: application
boot: auto
init: false
homeassistant_api: true
arch:
  - aarch64
options:
  interval_seconds: 60
  models:
    - "iPhone Duo / Star White / 512GB"
    - "iPhone Duo / Night Sky / 512GB"
    - "iPhone Duo / Star White / 256GB"
  watch: []
  buy_link_base: "https://www.apple.com/sg"
  proxy_url: ""
  apple_sg_stores: []
  notify_sold_out: false
  remind_every_minutes: 0
  track_delivery_dates: true
  send_test_alert: false
  ha_notify_service: ""
  ha_notify_priority: time_sensitive
  notify_mode: instant
  slack_bot_token: ""
  slack_channel: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  mood_enabled: false
  mood_ai_task_entity: ai_task.claude_ai_task
  mood_subreddits:
    - iPhoneDuo
  mood_news_enabled: true
  mood_news_query: "iPhone Duo"
  mood_digest_time: "21:00"
  reddit_client_id: ""
  reddit_client_secret: ""
schema:
  interval_seconds: "int(30,3600)"
  models:
    - "list(iPhone Duo / Night Sky / 256GB|iPhone Duo / Night Sky / 512GB|iPhone Duo / Night Sky / 1TB|iPhone Duo / Night Sky / 2TB|iPhone Duo / Star White / 256GB|iPhone Duo / Star White / 512GB|iPhone Duo / Star White / 1TB|iPhone Duo / Star White / 2TB)?"
  watch:
    - source: "list(apple_sg)"
      product: "str"
      variants:
        - "str"
  buy_link_base: "url?"
  proxy_url: "str?"
  apple_sg_stores:
    - "str?"
  notify_sold_out: "bool"
  remind_every_minutes: "int(0,60)?"
  track_delivery_dates: "bool?"
  send_test_alert: "bool"
  ha_notify_service: "str?"
  ha_notify_priority: "list(normal|time_sensitive|critical)?"
  notify_mode: "list(instant|daily_summary)?"
  slack_bot_token: "password?"
  slack_channel: "str?"
  telegram_bot_token: "password?"
  telegram_chat_id: "str?"
  mood_enabled: "bool?"
  mood_ai_task_entity: "str?"
  mood_subreddits:
    - "str?"
  mood_news_enabled: "bool?"
  mood_news_query: "str?"
  mood_digest_time: "match(^\\d{2}:\\d{2}$)?"
  reddit_client_id: "str?"
  reddit_client_secret: "password?"
  telegram_messages:
    - "list(stock|delivery|digest|status|test)?"
  slack_messages:
    - "list(stock|delivery|digest|status|test)?"
  ha_notify_messages:
    - "list(stock|delivery|digest|status|test)?"
